# Cloud Build configuration for development environment
steps:
  # Validate Terraform configuration
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd environments/dev
        # Copy terraform.tfvars.example if terraform.tfvars doesn't exist
        if [ ! -f terraform.tfvars ]; then
          echo "📋 Using terraform.tfvars.example as terraform.tfvars"
          cp terraform.tfvars.example terraform.tfvars
        fi
        terraform init
        terraform validate
        terraform fmt -check=true
    env:
      - 'TF_VAR_project_id=${_PROJECT_ID}'

  # Generate Terraform plan
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd environments/dev
        terraform plan -out=tfplan -var-file=terraform.tfvars
    env:
      - 'TF_VAR_project_id=${_PROJECT_ID}'

  # Apply Terraform plan
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd environments/dev
        terraform apply -auto-approve tfplan
    env:
      - 'TF_VAR_project_id=${_PROJECT_ID}'

  # Run post-deployment tests
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e  # Exit on error
        
        # Wait for instances to be ready
        sleep 30
        
        # Test instances
        echo "🔍 Checking development instances..."
        gcloud compute instances list --filter="labels.environment=dev AND labels.app=${_APP_NAME}" --format="table(name,status,INTERNAL_IP)" || true
        
        # Verify monitoring is working
        echo "📊 Checking monitoring policies..."
        gcloud alpha monitoring policies list --filter="displayName:${_APP_NAME}" --format="table(displayName)" || echo "⚠️  No monitoring policies found"
        
        echo "✅ Development deployment completed successfully!"

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

# Substitutions
substitutions:
  _PROJECT_ID: 'narainkarthik812-practice-dev'
  _APP_NAME: 'ownlyst'
  _ENVIRONMENT: 'dev'

# IAM
serviceAccount: 'projects/${_PROJECT_ID}/serviceAccounts/terraform-sa@${_PROJECT_ID}.iam.gserviceaccount.com'

# Timeout
timeout: '1200s'