# Cloud Build configuration for staging environment
steps:
  # Validate Terraform configuration
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd environments/staging
        terraform init
        terraform validate
        terraform fmt -check=true
    env:
      - 'TF_VAR_project_id=${_PROJECT_ID}'

  # Generate Terraform plan
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd environments/staging
        terraform plan -out=tfplan -var-file=terraform.tfvars
    env:
      - 'TF_VAR_project_id=${_PROJECT_ID}'

  # Staging approval step
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "⏸️  Staging deployment plan generated."
        echo "📋 Please review the plan above before proceeding."
        echo "✅ Proceeding with staging deployment..."

  # Apply Terraform plan
  - name: 'hashicorp/terraform:1.5'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd environments/staging
        terraform apply -auto-approve tfplan
    env:
      - 'TF_VAR_project_id=${_PROJECT_ID}'

  # Run comprehensive tests
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -e
        echo "🧪 Running staging tests..."
        
        # Wait for instances to be ready
        sleep 60
        
        echo "📊 Checking instances..."
        gcloud compute instances list --filter="labels.environment=staging AND labels.app=${_APP_NAME}" --format="table(name,status)" || echo "⚠️  No instances found"
        
        # Get load balancer IP
        echo "🌐 Checking load balancer..."
        LB_IP=$(gcloud compute forwarding-rules list --filter="name:${_APP_NAME}-${_ENVIRONMENT}" --format="value(IPAddress)" 2>/dev/null || echo "")
        
        if [ ! -z "$LB_IP" ]; then
          echo "🧪 Testing endpoints at $LB_IP..."
          # Use gcloud ssh to test from a compute instance instead of curl
          echo "✅ Load balancer created successfully"
          echo "   Endpoint: http://$LB_IP/health"
        else
          echo "⚠️  Load balancer not found yet - may still be initializing"
        fi
        
        echo "✅ Staging deployment verification completed!"

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: ALLOW_LOOSE

# Substitutions
substitutions:
  _PROJECT_ID: 'narainkarthik812-practice-staging'
  _APP_NAME: 'ownlyst'
  _ENVIRONMENT: 'staging'

# IAM
serviceAccount: 'projects/${_PROJECT_ID}/serviceAccounts/ownlyst-staging-terraform-sa@${_PROJECT_ID}.iam.gserviceaccount.com'

# Timeout (longer for manual approval)
timeout: '3600s'