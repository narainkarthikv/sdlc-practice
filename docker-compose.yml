name: todoist-platform

services:
  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "8081:8080"
    depends_on:
      - backend
      - agents

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_CONNECTION_MODE: proxy
      CORS_ORIGINS: http://localhost:8081
      DB_NAME: ${DB_NAME:-todoist}
      DB_USER: ${DB_USER:-todoist_user}
      DB_HOST: ${DB_HOST:-cloud-sql-proxy}
      DB_PORT: ${DB_PORT:-5432}
      INSTANCE_CONNECTION_NAME: ${INSTANCE_CONNECTION_NAME:-}
    depends_on:
      - cloud-sql-proxy
      - agents

  agents:
    build:
      context: ./agents
    env_file:
      - ./agents/.env
    ports:
      - "9000:9000"
    environment:
      PORT: 9000
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_REGION: ${GCP_REGION:-us-central1}
      VERTEX_MODEL: ${VERTEX_MODEL:-gemini-1.5-flash-001}
      ALLOWED_ORIGINS: http://localhost:8081

  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4
    command:
      - "--address=127.0.0.1"
      - "--port=5432"
      - "--auth-iam-authn"
      - "${INSTANCE_CONNECTION_NAME:-}"
    environment:
      INSTANCE_CONNECTION_NAME: ${INSTANCE_CONNECTION_NAME:-}
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    restart: unless-stopped
